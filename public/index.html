<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#08090d"
    >

    <title>TXG Security</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #08090d;
            color: #ffffff;
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
        }

        .page {
            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding:
                24px
                24px
                calc(70px + env(safe-area-inset-bottom));

            position: relative;

            background:
                radial-gradient(
                    circle at 50% 35%,
                    rgba(75, 100, 255, 0.12),
                    transparent 32%
                ),
                #08090d;
        }

        /*
        --------------------------------------------
        BRAND
        --------------------------------------------
        */

        .brand {
            position: absolute;
            top: calc(22px + env(safe-area-inset-top));
            left: 0;
            right: 0;

            text-align: center;

            font-size: 12px;
            font-weight: 800;
            letter-spacing: 3px;

            color: rgba(255,255,255,0.48);
        }

        /*
        --------------------------------------------
        MAIN CARD
        --------------------------------------------
        */

        .card {
            width: min(100%, 390px);

            padding: 34px 24px 30px;

            border-radius: 28px;

            background:
                linear-gradient(
                    180deg,
                    rgba(255,255,255,0.055),
                    rgba(255,255,255,0.018)
                );

            border: 1px solid rgba(255,255,255,0.07);

            box-shadow:
                0 25px 80px rgba(0,0,0,0.42),
                inset 0 1px 0 rgba(255,255,255,0.04);

            text-align: center;

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        /*
        --------------------------------------------
        LOADER
        --------------------------------------------
        */

        .loader {
            width: 108px;
            height: 108px;

            margin: 0 auto 28px;

            position: relative;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loader-ring {
            position: absolute;

            width: 100%;
            height: 100%;

            border-radius: 50%;

            border: 2px solid rgba(255,255,255,0.08);

            border-top-color: rgba(255,255,255,0.92);
            border-right-color: rgba(110,140,255,0.65);

            animation: spin 1.15s linear infinite;
        }

        .loader-ring::after {
            content: "";

            position: absolute;

            inset: 9px;

            border-radius: 50%;

            border: 1px solid rgba(255,255,255,0.07);

            animation: reverseSpin 1.8s linear infinite;
        }

        .loader-core {
            width: 58px;
            height: 58px;

            border-radius: 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.13),
                    rgba(255,255,255,0.035)
                );

            border: 1px solid rgba(255,255,255,0.08);

            box-shadow:
                0 10px 35px rgba(0,0,0,0.35);

            animation: pulse 1.7s ease-in-out infinite;
        }

        .loader-dot {
            width: 12px;
            height: 12px;

            border-radius: 50%;

            background: #ffffff;

            box-shadow:
                0 0 18px rgba(255,255,255,0.75);
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes reverseSpin {
            to {
                transform: rotate(-360deg);
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(0.94);
                opacity: 0.72;
            }

            50% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /*
        --------------------------------------------
        TEXT
        --------------------------------------------
        */

        .title {
            margin: 0;

            font-size: 24px;
            line-height: 1.2;

            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .subtitle {
            margin: 11px 0 0;

            font-size: 14px;
            line-height: 1.6;

            color: rgba(255,255,255,0.50);
        }

        /*
        --------------------------------------------
        RESULT
        --------------------------------------------
        */

        .result {
            display: none;
        }

        .result-icon {
            width: 82px;
            height: 82px;

            margin: 0 auto 22px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 34px;
            font-weight: 800;

            background:
                rgba(255,255,255,0.07);

            border: 1px solid rgba(255,255,255,0.11);

            box-shadow:
                0 15px 45px rgba(0,0,0,0.3);

            animation: resultIn 0.45s ease forwards;
        }

        @keyframes resultIn {
            from {
                opacity: 0;
                transform: scale(0.75);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .result-title {
            margin: 0;

            font-size: 25px;
            font-weight: 850;
            letter-spacing: -0.5px;
        }

        .result-subtitle {
            margin: 10px 0 0;

            font-size: 14px;
            line-height: 1.6;

            color: rgba(255,255,255,0.52);
        }

        /*
        --------------------------------------------
        BUTTON
        --------------------------------------------
        */

        .continue-btn,
        .retry-btn {
            width: 100%;

            margin-top: 26px;

            min-height: 52px;

            border: 0;
            border-radius: 16px;

            color: #ffffff;

            font-size: 15px;
            font-weight: 750;

            cursor: pointer;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.15),
                    rgba(255,255,255,0.065)
                );

            border: 1px solid rgba(255,255,255,0.10);

            box-shadow:
                0 12px 35px rgba(0,0,0,0.25);

            transition:
                transform 0.18s ease,
                background 0.18s ease;
        }

        .continue-btn:active,
        .retry-btn:active {
            transform: scale(0.97);
        }

        /*
        --------------------------------------------
        ERROR
        --------------------------------------------
        */

        .error {
            display: none;
        }

        /*
        --------------------------------------------
        FOOTER
        --------------------------------------------
        */

        .footer {
            position: fixed;

            left: 0;
            right: 0;

            bottom:
                calc(16px + env(safe-area-inset-bottom));

            text-align: center;

            z-index: 20;
        }

        .txg-link {
            display: inline-block;

            color: rgba(255,255,255,0.52);

            text-decoration: none;

            font-size: 13px;
            font-weight: 800;

            letter-spacing: 2px;

            padding: 8px 12px;

            border-radius: 12px;

            transition:
                color 0.2s ease,
                background 0.2s ease;
        }

        .txg-link:active {
            background: rgba(255,255,255,0.06);
            color: #ffffff;
        }

        /*
        --------------------------------------------
        ACCESSIBILITY
        --------------------------------------------
        */

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <div class="brand">
        TXG SECURITY
    </div>

    <div class="card">

        <!-- LOADING -->

        <div id="loading">

            <div class="loader">
                <div class="loader-ring"></div>

                <div class="loader-core">
                    <div class="loader-dot"></div>
                </div>
            </div>

            <h1 class="title">
                Verifying Device
            </h1>

            <p class="subtitle">
                Please wait while verification is completed.
            </p>

        </div>


        <!-- RESULT -->

        <div id="result" class="result">

            <div id="resultIcon" class="result-icon">
                ✓
            </div>

            <h1 id="resultTitle" class="result-title">
                VERIFIED
            </h1>

            <p id="resultSubtitle" class="result-subtitle">
                Device verification is complete.
            </p>

            <button
                id="continueButton"
                class="continue-btn"
                type="button"
            >
                Continue
            </button>

        </div>


        <!-- ERROR -->

        <div id="error" class="error">

            <div class="result-icon">
                !
            </div>

            <h1 class="result-title">
                Verification Failed
            </h1>

            <p id="errorText" class="result-subtitle">
                Please try again.
            </p>

            <button
                id="retryButton"
                class="retry-btn"
                type="button"
            >
                Retry
            </button>

        </div>

    </div>


    <!-- ALWAYS AT THE BOTTOM -->

    <div class="footer">

        <a
            class="txg-link"
            href="https://t.me/TXG_MAKER_bot"
            target="_blank"
            rel="noopener noreferrer"
        >
            #TXG
        </a>

    </div>

</div>


<script>
(function () {

    "use strict";


    /*
    ----------------------------------------------------
    TELEGRAM
    ----------------------------------------------------
    */

    const tg =
        window.Telegram &&
        window.Telegram.WebApp
            ? window.Telegram.WebApp
            : null;

    if (tg) {
        try {
            tg.ready();
            tg.expand();
        } catch (e) {}
    }


    /*
    ----------------------------------------------------
    ELEMENTS
    ----------------------------------------------------
    */

    const loading =
        document.getElementById("loading");

    const result =
        document.getElementById("result");

    const errorBox =
        document.getElementById("error");

    const resultIcon =
        document.getElementById("resultIcon");

    const resultTitle =
        document.getElementById("resultTitle");

    const resultSubtitle =
        document.getElementById("resultSubtitle");

    const errorText =
        document.getElementById("errorText");

    const continueButton =
        document.getElementById("continueButton");

    const retryButton =
        document.getElementById("retryButton");


    /*
    ----------------------------------------------------
    DEVICE ID
    ----------------------------------------------------
    */

    function getDeviceId() {

        const storageKey =
            "txg_device_id";

        try {

            let existing =
                localStorage.getItem(storageKey);

            if (
                existing &&
                /^[A-Za-z0-9._~-]{32,256}$/.test(existing)
            ) {
                return existing;
            }


            /*
            Generate 32 cryptographically
            random bytes.
            */

            const bytes =
                new Uint8Array(32);

            crypto.getRandomValues(bytes);

            let value = "";

            for (let i = 0; i < bytes.length; i++) {

                value +=
                    bytes[i]
                        .toString(16)
                        .padStart(2, "0");
            }


            localStorage.setItem(
                storageKey,
                value
            );

            return value;

        } catch (e) {

            /*
            If localStorage is unavailable,
            create a temporary random identifier.

            This will not survive a browser restart.
            */

            const bytes =
                new Uint8Array(32);

            crypto.getRandomValues(bytes);

            let value = "";

            for (let i = 0; i < bytes.length; i++) {

                value +=
                    bytes[i]
                        .toString(16)
                        .padStart(2, "0");
            }

            return value;
        }
    }


    /*
    ----------------------------------------------------
    BOT ID
    ----------------------------------------------------
    */

    function getBotId() {

        const params =
            new URLSearchParams(
                window.location.search
            );

        const fromUrl =
            params.get("bot_id");

        if (
            fromUrl &&
            /^[0-9]{1,30}$/.test(fromUrl)
        ) {
            return fromUrl;
        }


        /*
        Telegram start parameter fallback.
        */

        if (tg) {

            try {

                const startParam =
                    tg.initDataUnsafe &&
                    tg.initDataUnsafe.start_param;

                if (
                    startParam &&
                    /^[0-9]{1,30}$/.test(startParam)
                ) {
                    return startParam;
                }

            } catch (e) {}
        }

        return null;
    }


    /*
    ----------------------------------------------------
    SHOW RESULT
    ----------------------------------------------------
    */

    function showResult(data) {

        loading.style.display = "none";
        errorBox.style.display = "none";

        result.style.display = "block";

        if (data.status === "same_device") {

            resultIcon.textContent = "✓";

            resultTitle.textContent =
                "SAME DEVICE";

            resultSubtitle.textContent =
                "This device is already verified.";

        } else {

            resultIcon.textContent = "✓";

            resultTitle.textContent =
                "VERIFIED";

            resultSubtitle.textContent =
                "Device verification is complete.";
        }
    }


    /*
    ----------------------------------------------------
    SHOW ERROR
    ----------------------------------------------------
    */

    function showError(message) {

        loading.style.display = "none";
        result.style.display = "none";

        errorBox.style.display = "block";

        errorText.textContent =
            message ||
            "Verification could not be completed.";
    }


    /*
    ----------------------------------------------------
    VERIFY
    ----------------------------------------------------
    */

    async function verify() {

        loading.style.display = "block";
        result.style.display = "none";
        errorBox.style.display = "none";


        const botId =
            getBotId();

        if (!botId) {

            showError(
                "Invalid verification link."
            );

            return;
        }


        /*
        Telegram mode if Telegram
        provides initData.
        Otherwise normal website mode.
        */

        let mode = "website";

        let initData = "";


        if (
            tg &&
            typeof tg.initData === "string" &&
            tg.initData.length > 0
        ) {

            mode = "telegram";

            initData =
                tg.initData;
        }


        const deviceId =
            getDeviceId();


        try {

            const response =
                await fetch(
                    "/api/verify",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        cache: "no-store",

                        body: JSON.stringify({
                            mode: mode,
                            botId: botId,
                            deviceId: deviceId,
                            initData: initData
                        })
                    }
                );


            let data;

            try {
                data =
                    await response.json();
            } catch (e) {
                data = null;
            }


            if (
                !response.ok ||
                !data ||
                data.success !== true
            ) {

                showError(
                    "Verification could not be completed."
                );

                return;
            }


            showResult(data);


            /*
            Save continue URL only
            for fallback navigation.
            */

            if (
                data.continue_url &&
                typeof data.continue_url === "string"
            ) {

                continueButton.dataset.url =
                    data.continue_url;
            }


        } catch (e) {

            showError(
                "Connection failed. Please try again."
            );
        }
    }


    /*
    ----------------------------------------------------
    CONTINUE
    ----------------------------------------------------
    */

    continueButton.addEventListener(
        "click",
        function () {

            /*
            Telegram Mini App:
            close the Mini App.
            */

            if (
                tg &&
                typeof tg.close === "function"
            ) {

                try {
                    tg.close();
                    return;
                } catch (e) {}
            }


            /*
            Normal website fallback.
            */

            const url =
                continueButton.dataset.url;

            if (
                url &&
                /^https:\/\/t\.me\//i.test(url)
            ) {

                window.location.href = url;

            } else {

                /*
                If no Telegram URL is configured,
                simply keep the verified screen.
                */

                continueButton.textContent =
                    "Verified";
            }
        }
    );


    /*
    ----------------------------------------------------
    RETRY
    ----------------------------------------------------
    */

    retryButton.addEventListener(
        "click",
        function () {

            verify();
        }
    );


    /*
    ----------------------------------------------------
    START AUTOMATICALLY
    ----------------------------------------------------
    */

    verify();

})();
</script>

</body>
</html>

Ab screen par koi internal verification stage nahi dikhega — sirf premium loader chalega aur backend ka final result aayega.
